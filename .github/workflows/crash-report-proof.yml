name: crash-report proof (#1367)

# Proof for the CorbanuTerminal PR that uploads macOS crash reports when the
# core-security job fails. The two "(#1367)" steps in each job are copied
# byte-for-byte from .github/workflows/rust-ci-core-security.yml at
# CorbanuTerminal commit 6defab722ba8457d2afdcd943e6ee4d239f9fb6a
# (the job's first step re-checks that). Actions is disabled on the fork, so
# the proof runs here.
#   crash: a process dies with SIGSEGV and the job fails -> artifact with
#          that process's report only (the image's old reports are skipped).
#   pass:  the job passes -> both steps skipped, no artifact.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Used only in the artifact name, as in the real job.
        required: false
        type: string
        default: aarch64-apple-darwin

permissions:
  contents: read

jobs:
  crash:
    runs-on: macos-15
    env:
      PR_SHA: 6defab722ba8457d2afdcd943e6ee4d239f9fb6a
    steps:
      - name: Show runner and check the copied steps match the PR commit
        run: |
          set -euo pipefail
          sw_vers; uname -m
          curl -fsSL "https://raw.githubusercontent.com/darkmatter-sudo/CorbanuTerminal/${PR_SHA}/.github/workflows/rust-ci-core-security.yml" \
            | awk '/^      # #1367: a test binary once died/{p=1} /^      # Only main saves caches/{p=0} p' > pr.txt
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/workflows/crash-report-proof.yml" \
            | awk '/^  crash:/{j=1} j && /^      # #1367: a test binary once died/{p=1} p && /^      - name: End of copied steps/{exit} p' > here.txt
          wc -l pr.txt here.txt
          diff pr.txt here.txt && echo "copied steps identical to PR commit ${PR_SHA}"
      - name: "PROOF: deliberate SIGSEGV crash"
        run: |
          printf 'int main(void){volatile int *p = 0; return *p;}\n' > "$RUNNER_TEMP/crash.c"
          cc -o "$RUNNER_TEMP/crash1367" "$RUNNER_TEMP/crash.c"
          "$RUNNER_TEMP/crash1367"
      # #1367: a test binary once died with a bare SIGSEGV and no output, and
      # the log could not say which thread faulted. When this job fails on
      # macOS, keep the crash reports (`*.ips`) so the next occurrence can.
      # The runner image ships old reports from its own build, so only take
      # files changed within this job's 60-minute timeout (+10). ReportCrash
      # writes a report a few seconds after the crash, so wait briefly when
      # none is there yet.
      - name: Collect macOS crash reports (#1367)
        if: ${{ failure() && runner.os == 'macOS' }}
        working-directory: .
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/crash-reports"
          mkdir -p "$out"
          for _ in 1 2 3 4 5 6; do
            find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
              -maxdepth 1 -name '*.ips' -mmin -70 -exec cp -p {} "$out/" \; 2>/dev/null
            [ -n "$(ls -A "$out")" ] && break
            sleep 5
          done
          ls -l "$out"
      - name: Upload macOS crash reports (#1367)
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-crash-reports-${{ inputs.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: End of copied steps
        if: always()
        run: echo done
  pass:
    runs-on: macos-15
    env:
      PR_SHA: 6defab722ba8457d2afdcd943e6ee4d239f9fb6a
    steps:
      - name: Show runner and check the copied steps match the PR commit
        run: |
          set -euo pipefail
          sw_vers; uname -m
          curl -fsSL "https://raw.githubusercontent.com/darkmatter-sudo/CorbanuTerminal/${PR_SHA}/.github/workflows/rust-ci-core-security.yml" \
            | awk '/^      # #1367: a test binary once died/{p=1} /^      # Only main saves caches/{p=0} p' > pr.txt
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/workflows/crash-report-proof.yml" \
            | awk '/^  pass:/{j=1} j && /^      # #1367: a test binary once died/{p=1} p && /^      - name: End of copied steps/{exit} p' > here.txt
          wc -l pr.txt here.txt
          diff pr.txt here.txt && echo "copied steps identical to PR commit ${PR_SHA}"
      - name: "PROOF: passing step"
        run: echo "nothing fails"
      # #1367: a test binary once died with a bare SIGSEGV and no output, and
      # the log could not say which thread faulted. When this job fails on
      # macOS, keep the crash reports (`*.ips`) so the next occurrence can.
      # The runner image ships old reports from its own build, so only take
      # files changed within this job's 60-minute timeout (+10). ReportCrash
      # writes a report a few seconds after the crash, so wait briefly when
      # none is there yet.
      - name: Collect macOS crash reports (#1367)
        if: ${{ failure() && runner.os == 'macOS' }}
        working-directory: .
        run: |
          set -uo pipefail
          out="${RUNNER_TEMP}/crash-reports"
          mkdir -p "$out"
          for _ in 1 2 3 4 5 6; do
            find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
              -maxdepth 1 -name '*.ips' -mmin -70 -exec cp -p {} "$out/" \; 2>/dev/null
            [ -n "$(ls -A "$out")" ] && break
            sleep 5
          done
          ls -l "$out"
      - name: Upload macOS crash reports (#1367)
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: macos-crash-reports-${{ inputs.target }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: End of copied steps
        if: always()
        run: echo done
